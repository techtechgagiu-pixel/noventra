# Render Blueprint — one free Node web service: the analysis runner („betmind-nexus”) only.
# The site runs on Cloudflare Workers; durable data lives in Cloudflare D1. Render reads and writes D1 through the
# signed bridge of the production Worker (BETMIND_DATABASE=d1-http), never on Render's disk.
services:
  - type: web
    name: betmind-nexus
    runtime: node
    plan: free
    region: frankfurt
    branch: betmind-six
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_BASE_URL
        value: https://primul11.noventra.ro
      - key: APP_TIMEZONE
        value: Europe/Bucharest
      - key: BETMIND_DATABASE
        value: d1-http
      - key: BETMIND_RUNNER_ONLY
        value: "1"
      - key: BETMIND_MAINTENANCE
        value: "0"
      - key: BETMIND_DISABLE_WORKER
        value: "0"
      # Production Worker URL and the same server-only secret as the Worker: set in the Render dashboard, never here.
      - key: D1_BRIDGE_URL
        sync: false
      - key: D1_BRIDGE_SECRET
        sync: false
      # Legacy Postgres (Neon) connection, unused while BETMIND_DATABASE=d1-http.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: OWNER_ACCESS_CODE_HASH
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
